<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FDFEFF"/>
    <stop offset="0.55" stop-color="#F4F8FF"/>
    <stop offset="1" stop-color="#EAF0FC"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="45%" cy="25%" r="78%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#D9E5FB" stop-opacity=".08"/>
  </radialGradient>
  <linearGradient id="rear" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#615DFF"/>
    <stop offset=".42" stop-color="#D83FF1"/>
    <stop offset=".72" stop-color="#F84F9D"/>
    <stop offset="1" stop-color="#FFC42E"/>
  </linearGradient>
  <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12E2EF"/>
    <stop offset=".45" stop-color="#1685FF"/>
    <stop offset=".78" stop-color="#4847FA"/>
    <stop offset="1" stop-color="#8A66F7"/>
  </linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#F5FDFF" stop-opacity=".98"/>
    <stop offset=".42" stop-color="#D4E8FF" stop-opacity=".95"/>
    <stop offset=".76" stop-color="#B6CFFF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#D8C9FF" stop-opacity=".97"/>
  </linearGradient>
  <linearGradient id="frontSheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".0"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4C68A2" flood-opacity=".18"/>
  </filter>
  <filter id="shadowFront" x="-25%" y="-25%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4C61A0" flood-opacity=".2"/>
  </filter>
  <clipPath id="clipRear"><rect x="410" y="170" width="425" height="540" rx="82"/></clipPath>
  <clipPath id="clipMiddle"><rect x="300" y="240" width="425" height="540" rx="82"/></clipPath>
  <clipPath id="clipFront"><rect x="190" y="310" width="425" height="540" rx="82"/></clipPath>
</defs>
<!-- pale, soft macOS-style canvas -->
<rect width="1024" height="1024" rx="210" fill="url(#bg)"/>
<rect width="1024" height="1024" rx="210" fill="url(#bgGlow)"/>
<rect x="1.5" y="1.5" width="1021" height="1021" rx="208.5" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3"/>
<!-- All three panels intentionally use identical 425 × 540 geometry. -->
<g filter="url(#shadow)">
  <rect x="410" y="170" width="425" height="540" rx="82" fill="url(#rear)"/>
  <g clip-path="url(#clipRear)">
    <path d="M410 170H835V285C735 250 623 240 410 305Z" fill="#FFFFFF" fill-opacity=".14"/>
    <rect x="411" y="171" width="423" height="538" rx="81" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="3"/>
  </g>
  <rect x="300" y="240" width="425" height="540" rx="82" fill="url(#middle)"/>
  <g clip-path="url(#clipMiddle)">
    <path d="M300 240H725V345C650 318 500 305 300 370Z" fill="#FFFFFF" fill-opacity=".16"/>
    <rect x="301" y="241" width="423" height="538" rx="81" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3"/>
  </g>
</g>
<g filter="url(#shadowFront)">
  <rect x="190" y="310" width="425" height="540" rx="82" fill="url(#front)"/>
  <g clip-path="url(#clipFront)">
    <path d="M190 310H615V420C520 395 385 374 190 445Z" fill="url(#frontSheen)"/>
    <path d="M190 680C345 735 475 762 615 778V850H190Z" fill="#FFFFFF" fill-opacity=".15"/>
    <rect x="191.5" y="311.5" width="422" height="537" rx="80.5" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3"/>
  </g>
</g>
</svg>